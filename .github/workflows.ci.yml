name: Docker Build Check

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      -name: Download code from repository
       used: actions/checkout@v4

      -name: Check syntax python
       run: python3 -m py_compile main.py

      -name: Testing the Docker image build
       run: docker build -t my-python-parser
